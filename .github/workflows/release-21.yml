name: Release
on:
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          ref: main
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.6  
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' 
          cache: 'maven'
          java-version: 21
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Perform Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          USER_NAME: ${{ secrets.GHA_USER }}
          ACCESS_TOKEN: ${{ secrets.GHA_PASS }}
          JASYPT_TOKEN: ${{ secrets.JASYPT_ENCRYPTOR }}
        run: |
          git push origin -d release
          git checkout -b release
          git push origin release
          git push origin -d pre-release
          git checkout -b pre-release
          git push origin pre-release          
      - name: Perform Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          USER_NAME: ${{ secrets.GHA_USER }}
          ACCESS_TOKEN: ${{ secrets.GHA_PASS }}
          JASYPT_TOKEN: ${{ secrets.JASYPT_ENCRYPTOR }}
        working-directory: ./parent
        run: mvn -X -e -DautoVersionSubmodules=true -Dmaven.javadoc.skip=true -Dgit.user=$USER_NAME -Dgit.password=$ACCESS_TOKEN -Djasypt.encryptor.password=$JASYPT_TOKEN -s $GITHUB_WORKSPACE/.github/workflows/maven-settings.xml -B jgitflow:release-start jgitflow:release-finish
      - name: Push changes to Git
        env:
          GITHUB_TOKEN: ${{ secrets.GHA_PASS }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          USER_NAME: ${{ secrets.GHA_USER }}
          ACCESS_TOKEN: ${{ secrets.GHA_PASS }}
          JASYPT_TOKEN: ${{ secrets.JASYPT_ENCRYPTOR }}
        working-directory: ./parent
        run: git push origin release pre-release --tags
