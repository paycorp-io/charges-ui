on:
  workflow_call:
    inputs:
      parent-folder-path:
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
jobs:
  build:
    name: Shared Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.7
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'zulu' # Alternative distribution options are available
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # used by sonar
          USER_NAME: ${{ secrets.GHA_USER }}
          ACCESS_TOKEN: ${{ secrets.GHA_PASS }}
          JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR }} # required for build
          PARENT_FOLDER_PATH: ${{ inputs.parent-folder-path }}
        working-directory: ./${{ env.PARENT_FOLDER_PATH }}
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/maven-settings.xml -B verify --file pom.xml
